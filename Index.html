<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Mundo de los Perros</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f8ff;
      text-align: center;
      padding: 40px;
    }

    h1 {
      color: #2c3e50;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      max-width: 450px;
      margin: auto;
      box-shadow: 0 4px 10px #0002;
    }

    button {
      background: #3498db;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>🐶 El Mundo de los Perros</h1>

    <h2>¡Nuestros mejores amigos!</h2>

    <p>
      Los perros son animales leales,
      inteligentes y nobles.
    </p>

    <p>
      Existen muchas razas y cada una
      tiene características especiales.
    </p>

    <button onclick="saludar()">
      ¡Haz clic aquí!
    </button>
  </div>

  <script>
    function saludar() {
      alert("¡Guau guau! 🐕");
    }
  </script>
</body>
</html>
